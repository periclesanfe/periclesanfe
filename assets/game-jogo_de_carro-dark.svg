  <rect x="520" y="14" width="12" height="192" fill="#3d6b3a"/><rect x="784" y="14" width="12" height="192" fill="#3d6b3a"/>
  <path d="M535 14V206M781 14V206" stroke="#c9ccd6" stroke-width="2" opacity=".7"/>
  <g class="dash" fill="#e8b93a" opacity=".85"><rect x="615.5" y="-26" width="4" height="22" rx="1"/><rect x="615.5" y="14" width="4" height="22" rx="1"/><rect x="615.5" y="54" width="4" height="22" rx="1"/><rect x="615.5" y="94" width="4" height="22" rx="1"/><rect x="615.5" y="134" width="4" height="22" rx="1"/><rect x="615.5" y="174" width="4" height="22" rx="1"/><rect x="615.5" y="214" width="4" height="22" rx="1"/><rect x="696.5" y="-26" width="4" height="22" rx="1"/><rect x="696.5" y="14" width="4" height="22" rx="1"/><rect x="696.5" y="54" width="4" height="22" rx="1"/><rect x="696.5" y="94" width="4" height="22" rx="1"/><rect x="696.5" y="134" width="4" height="22" rx="1"/><rect x="696.5" y="174" width="4" height="22" rx="1"/><rect x="696.5" y="214" width="4" height="22" rx="1"/></g>
  <g class="truck"><svg x="549.0" y="-130" width="56" height="128" viewBox="0 0 28 64"><image class="px wheel" href="data:image/png;base64," width="56" height="64" image-rendering="optimizeSpeed"/></svg></g>
  <g class="van"><svg x="713.0" y="30" width="52" height="96" viewBox="0 0 26 48"><image class="px wheel" href="data:image/png;base64," width="52" height="48" image-rendering="optimizeSpeed"/></svg></g>
  <g class="cone"><svg x="644.0" y="40" width="28" height="32" viewBox="0 0 14 16"><image class="px" href="data:image/png;base64," width="14" height="16" image-rendering="optimizeSpeed"/></svg></g>
  <g class="player"><svg x="634.0" y="116" width="48" height="80" viewBox="0 0 24 40"><image class="px wheel" href="data:image/png;base64," width="48" height="40" image-rendering="optimizeSpeed"/></svg></g>
</g>
<rect class="frame" x="520.5" y="14.5" width="275" height="191" rx="10"/>
</svg>
