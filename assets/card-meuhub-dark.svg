<text class="sans desc" x="20" y="122">Link-in-bio storefront for Instagram</text>
<text class="sans desc" x="20" y="145">and WhatsApp sellers. Customers pick</text>
<text class="sans desc" x="20" y="168">size or flavor; the order lands in</text>
<text class="sans desc" x="20" y="191">WhatsApp, ready-made.</text>
