<rect class="chip" x="81.5" y="212" width="70.5" height="28" rx="6"/><text class="mono chipt" x="116.8" y="226" text-anchor="middle">Express</text>
<rect class="chip" x="158.0" y="212" width="93.0" height="28" rx="6"/><text class="mono chipt" x="204.5" y="226" text-anchor="middle">PostgreSQL</text>
